[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beaver-db"
version = "0.1.0"
description = "An educational relational DBMS built from scratch in Python"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/beaver_db"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "A", "ARG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["src"]
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "basedpyright>=1.31.0",
    "hypothesis>=6.168.0",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]